<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zilarte - Guía de Hilorama</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f5f0; /* Fondo cálido suave */
            color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border-top: 5px solid #2c3e50;
        }
        h2 { margin-top: 0; color: #1e293b; letter-spacing: 0.5px; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #3b82f6;
        }
        button {
            background-color: #1e293b; /* Tono oscuro elegante Zilarte */
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background-color: #334155; }
        button:active { transform: scale(0.98); }
        
        .counter-container {
            margin-top: 20px;
            display: none;
        }
        #current-number {
            font-size: 90px;
            font-weight: 800;
            color: #0f172a;
            margin: 10px 0;
            line-height: 1;
        }
        .progress-info {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        /* Estilos para el historial de anteriores */
        .history-box {
            background-color: #f1f5f9;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px dashed #cbd5e1;
        }
        .history-title {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .history-items {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 18px;
            color: #475569;
            font-weight: 600;
        }

        .buttons-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn-nav {
            flex: 1;
            padding: 22px;
            font-size: 20px;
            border-radius: 12px;
            margin-top: 0;
        }
        .btn-prev { background-color: #94a3b8; }
        .btn-prev:hover { background-color: #64748b; }
        .btn-next { background-color: #0d9488; } /* Verde petróleo/esmeralda elegante para avanzar */
        .btn-next:hover { background-color: #0f766e; }
        
        .progress-bar {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-fill {
            background-color: #0d9488;
            height: 100%;
            width: 0%;
            transition: width 0.2s;
        }
        .reset-link {
            margin-top: 20px;
            display: inline-block;
            color: #e11d48;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
        .reset-link:hover {
            color: #be123c;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="setup-section">
            <h2>Zilarte • Guía de Hilorama</h2>
            <p style="font-size: 14px; color: #475569; margin-bottom: 15px;">Pega aquí tus números</p>
            <textarea id="numbers-input" placeholder="Ej:&#10;12&#10;45&#10;89..."></textarea>
            <br>
            <button onclick="cargarLista()" style="width: 100%;">Comenzar a hilar mi zilArte</button>
        </div>

        <div id="counter-section" class="counter-container">
            <div class="progress-info">Paso <span id="current-index">0</span> de <span id="total-numbers">0</span></div>
            
            <!-- Historial de los últimos 3 números -->
            <div class="history-box">
                <div class="history-title">Anteriores</div>
                <div class="history-items" id="history-list">--</div>
            </div>

            <div id="current-number">--</div>
            
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>

            <div class="buttons-row">
                <button class="btn-nav btn-prev" onclick="anterior()">⬅ Anterior</button>
                <button class="btn-nav btn-next" onclick="siguiente()">Siguiente ➡</button>
            </div>
            
            <span class="reset-link" onclick="reiniciarConfig()">Cargar otra lista / Reiniciar</span>
        </div>
    </div>

    <script>
        let listaNumeros = [];
        let indiceActual = 0;

        function obtenerListaDesdeHash() {
            const raw = window.location.hash.slice(1);
            if (!raw) return null;

            let texto;
            try {
                texto = decodeURIComponent(raw);
            } catch (e) {
                texto = raw;
            }

            const numeros = texto.split(',')
                .map(n => n.trim())
                .filter(n => /^-?\d+(?:\.\d+)?$/.test(n));

            return numeros.length > 0 ? numeros : null;
        }

        function listasIguales(a, b) {
            return a.length === b.length && a.every((n, i) => n === b[i]);
        }

        function cargarListaDesdeHash(numeros) {
            const guardado = localStorage.getItem('zilarte_lista');
            const indiceGuardado = localStorage.getItem('zilarte_indice');
            let listaGuardada = [];

            try {
                listaGuardada = guardado ? JSON.parse(guardado) : [];
            } catch (e) {
                listaGuardada = [];
            }

            listaNumeros = numeros;
            if (listasIguales(listaGuardada, numeros) && indiceGuardado !== null) {
                indiceActual = parseInt(indiceGuardado, 10) || 0;
            } else {
                indiceActual = 0;
            }

            guardarEstado();
            mostrarContador();
        }

        function iniciar() {
            const desdeHash = obtenerListaDesdeHash();
            if (desdeHash) {
                cargarListaDesdeHash(desdeHash);
                return;
            }

            const guardado = localStorage.getItem('zilarte_lista');
            const indiceGuardado = localStorage.getItem('zilarte_indice');
            if (guardado) {
                listaNumeros = JSON.parse(guardado);
                indiceActual = indiceGuardado ? parseInt(indiceGuardado, 10) : 0;
                if (listaNumeros.length > 0) {
                    mostrarContador();
                }
            }
        }

        window.onload = iniciar;
        window.addEventListener('hashchange', iniciar);

        function cargarLista() {
            const texto = document.getElementById('numbers-input').value;
            listaNumeros = texto.trim().split(/\s+/).filter(n => n !== "");
            
            if (listaNumeros.length === 0) {
                alert("Por favor pega una lista válida de números.");
                return;
            }

            indiceActual = 0;
            guardarEstado();
            mostrarContador();
        }

        function mostrarContador() {
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('counter-section').style.display = 'block';
            document.getElementById('total-numbers').textContent = listaNumeros.length;
            actualizarVista();
        }

        function actualizarVista() {
            if (indiceActual >= listaNumeros.length) {
                document.getElementById('current-number').textContent = "¡FIN!";
                document.getElementById('current-index').textContent = listaNumeros.length;
                document.getElementById('progress-fill').style.width = "100%";
                document.getElementById('history-list').textContent = "---";
                return;
            }

            if (indiceActual < 0) indiceActual = 0;

            // Mostrar número actual
            document.getElementById('current-number').textContent = listaNumeros[indiceActual];
            document.getElementById('current-index').textContent = indiceActual + 1;
            
            // Calcular los últimos 3 números vistos
            let ultimos3 = [];
            for (let i = 3; i >= 1; i--) {
                if (indiceActual - i >= 0) {
                    ultimos3.push(listaNumeros[indiceActual - i]);
                } else {
                    ultimos3.push("-");
                }
            }
            document.getElementById('history-list').textContent = ultimos3.join("  •  ");

            // Barra de progreso
            const porcentaje = ((indiceActual + 1) / listaNumeros.length) * 100;
            document.getElementById('progress-fill').style.width = porcentaje + "%";
            
            guardarEstado();
        }

        function siguiente() {
            if (indiceActual < listaNumeros.length) {
                indiceActual++;
                actualizarVista();
            }
        }

        function anterior() {
            if (indiceActual > 0) {
                indiceActual--;
                actualizarVista();
            }
        }

        function guardarEstado() {
            localStorage.setItem('zilarte_lista', JSON.stringify(listaNumeros));
            localStorage.setItem('zilarte_indice', indiceActual);
        }

        function reiniciarConfig() {
            if (confirm("¿Seguro que quieres borrar la lista actual?")) {
                localStorage.removeItem('zilarte_lista');
                localStorage.removeItem('zilarte_indice');
                if (window.location.hash) {
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                }
                document.getElementById('setup-section').style.display = 'block';
                document.getElementById('counter-section').style.display = 'none';
                document.getElementById('numbers-input').value = '';
            }
        }

        // Control opcional con el teclado
        document.addEventListener('keydown', function(event) {
            if (document.getElementById('counter-section').style.display === 'block') {
                if (event.code === 'Space' || event.code === 'ArrowRight') {
                    event.preventDefault();
                    siguiente();
                } else if (event.code === 'ArrowLeft') {
                    event.preventDefault();
                    anterior();
                }
            }
        });
    </script>
</body>
</html>
